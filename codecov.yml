# coverage is information, a drop never fails a pull request and the
# bot stays out of the conversation
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment: false
github_checks:
  annotations: false
# a line with an untaken branch counts as covered, so the badge shows the
# line coverage of the gcovr summary, the branch figure stays in the log
# of the workflow
parsers:
  cobertura:
    partials_as_hits: true
