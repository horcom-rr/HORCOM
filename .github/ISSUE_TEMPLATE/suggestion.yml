name: Suggest a change
description: An idea or a wish for HORCOM.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea! HORCOM follows Robert Rettig's original program in its menus, dialogs and calculations, so changes that keep his structure are the easiest to adopt.
  - type: textarea
    id: wish
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: How did the original HORCOM handle this?
      description: Leave this empty if you don't know the original.
  - type: textarea
    id: why
    attributes:
      label: How would it help you?
