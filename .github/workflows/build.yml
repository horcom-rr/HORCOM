name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/apps/horcom.exe dist/
          Copy-Item build/apps/horcom_gui.exe dist/
          Copy-Item -Recurse data dist/data
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release dist/horcom_gui.exe
          Compress-Archive -Path dist/* -DestinationPath horcom-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: horcom-windows-x64
          path: horcom-windows-x64.zip

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: v0.${{ github.run_number }}
          body: Windows build of this push. Unzip and start horcom_gui.exe. Versions stay 0.x until the port of the original is complete.
          make_latest: true
          files: horcom-windows-x64.zip
